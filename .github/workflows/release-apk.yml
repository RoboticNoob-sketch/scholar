name: Release Android APK

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - name: Verify tag matches pubspec version
        run: |
          pubspec_version=$(grep -m1 '^version:' pubspec.yaml | sed 's/version:[[:space:]]*//; s/+.*//')
          tag_version="${GITHUB_REF_NAME#v}"
          if [ "$pubspec_version" != "$tag_version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match pubspec version $pubspec_version"
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
          {
            echo "storePassword=$STORE_PASSWORD"
            echo "keyPassword=$KEY_PASSWORD"
            echo "keyAlias=upload"
            echo "storeFile=app/upload-keystore.jks"
          } > android/key.properties

      - run: flutter pub get

      - run: flutter build apk --release

      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-release.apk scholarly.apk

      - name: Upload to Hostinger
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_DIR: ${{ secrets.FTP_DIR }}
        run: |
          curl --fail --ssl-reqd --ftp-create-dirs \
            --user "$FTP_USERNAME:$FTP_PASSWORD" \
            -T scholarly.apk \
            -Q "+RNFR scholarly.apk.part" -Q "+RNTO scholarly.apk" \
            "ftp://$FTP_HOST/${FTP_DIR#/}/scholarly.apk.part"

      - name: Attach to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" scholarly.apk \
            --repo "$GITHUB_REPOSITORY" \
            --title "Scholarly $GITHUB_REF_NAME" \
            --generate-notes
